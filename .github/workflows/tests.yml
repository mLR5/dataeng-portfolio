name: Tests ingestion

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            functions/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test ingestion without external services
        run: python -m pytest --ignore-glob='tests/test_silver*.py' --cov=shared --cov=weather_ingestion_trigger --cov=manual_weather_trigger --cov=weather_bronze_processor --cov-report=term-missing
