name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Databricks provider: same service principal as azure/login, passed as masked
    # Terraform variables so that azurerm keeps its current Azure CLI authentication.
    - name: Expose the service principal to the Databricks provider
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      run: |
        for key in clientId clientSecret tenantId; do
          echo "::add-mask::$(jq -r ".$key" <<<"$AZURE_CREDENTIALS")"
        done
        {
          echo "TF_VAR_databricks_client_id=$(jq -r .clientId <<<"$AZURE_CREDENTIALS")"
          echo "TF_VAR_databricks_client_secret=$(jq -r .clientSecret <<<"$AZURE_CREDENTIALS")"
          echo "TF_VAR_databricks_tenant_id=$(jq -r .tenantId <<<"$AZURE_CREDENTIALS")"
        } >> "$GITHUB_ENV"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./infra
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}"

    - name: Terraform Apply
      working-directory: ./infra
      run: terraform apply -auto-approve
      env:
        TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
        TF_VAR_project_name: ${{ secrets.TF_VAR_PROJECT_NAME }}
        TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
        TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
        TF_VAR_storage_account_name: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
        TF_VAR_bronze_monitoring_enabled: ${{ vars.BRONZE_MONITORING_ENABLED || 'true' }}
        TF_VAR_bronze_alert_action_group_ids: ${{ vars.BRONZE_ALERT_ACTION_GROUP_IDS || '[]' }}
        TF_VAR_databricks_enabled: ${{ vars.DATABRICKS_ENABLED || 'true' }}
        TF_VAR_databricks_silver_path: ${{ vars.DATABRICKS_SILVER_PATH || 'silver/weatherapi' }}
        TF_VAR_databricks_schedule_paused: ${{ vars.DATABRICKS_SCHEDULE_PAUSED || 'false' }}
        TF_VAR_databricks_alert_emails: ${{ vars.DATABRICKS_ALERT_EMAILS || '[]' }}
