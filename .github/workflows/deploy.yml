name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./infra
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}"

    - name: Terraform Apply
      working-directory: ./infra
      run: terraform apply -auto-approve
      env:
        TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
        TF_VAR_project_name: ${{ secrets.TF_VAR_PROJECT_NAME }}
        TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
        TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
        TF_VAR_storage_account_name: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
        TF_VAR_bronze_monitoring_enabled: ${{ vars.BRONZE_MONITORING_ENABLED || 'true' }}
        TF_VAR_bronze_alert_action_group_ids: ${{ vars.BRONZE_ALERT_ACTION_GROUP_IDS || '[]' }}
        TF_VAR_silver_monitoring_enabled: ${{ vars.SILVER_MONITORING_ENABLED || 'true' }}
        TF_VAR_silver_enabled: ${{ vars.SILVER_ENABLED || 'true' }}
        TF_VAR_silver_batch_hour_utc: ${{ vars.SILVER_BATCH_HOUR_UTC || '2' }}
        TF_VAR_silver_alert_action_group_ids: ${{ vars.SILVER_ALERT_ACTION_GROUP_IDS || '[]' }}
