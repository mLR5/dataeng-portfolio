name: Profile Gold alignment (read-only)

# Evidence for the Gold model: reads silver/weatherapi_v2 with delta-rs and prints
# counts and distributions only (no key, value, path or secret).
on:
  push:
    branches: [validation/gold-alignment]
    paths: ['.github/workflows/profile-gold-alignment.yml', '.github/profile/gold_alignment.py']

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Storage key (masked)
        run: |
          echo "::add-mask::$(az account show --query id -o tsv)"
          key=$(az storage account keys list -n "$ACCOUNT" --only-show-errors --query "[0].value" -o tsv)
          echo "::add-mask::$key"
          echo "STORAGE_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet deltalake==1.2.1 pyarrow==21.0.0 duckdb==2.0.0 pytz
      - name: Profile
        run: python -I .github/profile/gold_alignment.py
