name: Read-only daily Silver validation progress
on:
  push:
    branches: [audit/silver-daily-progress]
    paths: ['scripts/read_silver_daily_progress.py', '.github/workflows/read-silver-daily-progress.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    env:
      PROJECT_NAME: ${{ secrets.TF_VAR_PROJECT_NAME }}
      ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install azure-storage-blob azure-storage-queue
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: python scripts/read_silver_daily_progress.py
