name: Test Silver Delta

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  silver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-silver.txt
            functions/requirements.txt
      - name: Install Bronze and Silver dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-silver.txt
      - name: Validate dependency compatibility
        run: python -m pip check
      - name: Test Bronze and Silver including real local Delta tables
        run: python -m pytest -q
