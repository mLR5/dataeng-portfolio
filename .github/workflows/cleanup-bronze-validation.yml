name: Clean Bronze Validation Copies

on:
  push:
    branches: [validation/bronze-delivery-cleanup]
    paths:
      - '.github/workflows/cleanup-bronze-validation.yml'
      - 'scripts/cleanup_bronze_validation.py'
      - 'scripts/bronze_cleanup_reference.json'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project SDKs
        run: python -m pip install -r functions/requirements.txt
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Remove only the two identified validation copies
        env:
          AZURE_PROJECT_NAME: ${{ secrets.TF_VAR_PROJECT_NAME }}
          AZURE_ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
        run: python scripts/cleanup_bronze_validation.py
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-validation-cleanup-evidence
          path: validation-cleanup-report.json
          if-no-files-found: warn
          retention-days: 30
