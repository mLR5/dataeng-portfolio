name: Read-only Azure project inventory
on:
  push:
    branches: [audit/azure-resource-inventory]
    paths:
      - '.github/workflows/azure-resource-inventory.yml'
      - 'scripts/azure_resource_inventory.py'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    env:
      PROJECT_NAME: ${{ secrets.TF_VAR_PROJECT_NAME }}
      ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install azure-storage-blob azure-storage-queue
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read resource names, roles and storage metadata
        run: python scripts/azure_resource_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-resource-inventory
          path: azure-resource-inventory.json
          if-no-files-found: warn
          retention-days: 7
