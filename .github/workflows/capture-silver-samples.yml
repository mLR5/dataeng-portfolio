name: Capture Existing Bronze Samples
on:
  push:
    branches: [validation/silver-samples]
    paths:
      - '.github/workflows/capture-silver-samples.yml'
      - 'scripts/capture_bronze_samples.py'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read two existing Bronze blobs
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
        run: python scripts/capture_bronze_samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: silver-bronze-real-samples
          path: bronze-samples
          if-no-files-found: error
          retention-days: 14
