name: Validate WeatherAPI Coordinates and Horizon
on:
  push:
    branches: [validation/weather-source]
    paths:
      - '.github/workflows/validate-weather-source.yml'
      - 'scripts/validate_weather_source.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the project and Silver dependencies
        run: python -m pip install -r functions/requirements.txt -r requirements-silver.txt
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check live source and local Silver without writing to Azure
        env:
          PROJECT_NAME: ${{ secrets.TF_VAR_PROJECT_NAME }}
          ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
          VALIDATED_COMMIT: 'c8f4c48692c64735359dea3fe4c98033d106fa36'
        run: python scripts/validate_weather_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-source-evidence
          path: weather-source-report.json
          if-no-files-found: warn
          retention-days: 30
