name: Validate Deployed WeatherAPI Coordinates and Horizon
on:
  push:
    branches: [validation/weather-source-deployed]
    paths:
      - '.github/workflows/validate-weather-source-deployed.yml'
      - 'scripts/validate_weather_source_deployed.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the project and Silver dependencies
        run: python -m pip install -r functions/requirements.txt -r requirements-silver.txt
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Invoke one normal ingestion and verify actual Bronze and local Silver
        env:
          PROJECT_NAME: ${{ secrets.TF_VAR_PROJECT_NAME }}
          ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
          VALIDATED_COMMIT: '766cf18340ede11d0c46077779d730faa3f79ba3'
        run: python scripts/validate_weather_source_deployed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-source-evidence
          path: weather-source-report.json
          if-no-files-found: warn
          retention-days: 30
