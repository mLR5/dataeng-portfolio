name: Test Silver Spark

on:
  push:
    branches: [main, 'feat/silver-databricks-*']
    paths:
      - 'spark/**'
      - 'functions/shared/**'
      - 'pyproject.toml'
      - 'requirements-spark.txt'
      - 'requirements-silver.txt'
      - 'databricks.yml'
      - 'resources/**'
      - '.github/workflows/test-silver-spark.yml'
  pull_request:
    paths:
      - 'spark/**'
      - 'functions/shared/**'
      - 'pyproject.toml'
      - 'requirements-spark.txt'
      - 'databricks.yml'
      - 'resources/**'
      - '.github/workflows/test-silver-spark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-silver.txt
            requirements-spark.txt
      - name: Install Bronze, Silver delta-rs and Spark dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-silver.txt -r requirements-spark.txt
      - name: Test Spark Silver against real local Delta tables and the S3 runner
        run: |
          set -o pipefail
          python -m pytest spark/tests -q -p no:cacheprovider -o testpaths=spark/tests -rs | tee /tmp/spark-tests.txt
          # Delta tests skip locally without Maven; in CI a skip would hide the real proof.
          ! grep -q "Delta Lake jars unavailable" /tmp/spark-tests.txt
      - name: Build the Databricks wheel and check its contents
        run: |
          python -m build --wheel --outdir dist .
          python - <<'EOF'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = set(wheel.namelist())
          for required in ("silver_spark/job.py", "shared/silver_transform.py", "shared/silver_checks.py"):
              assert required in names, required
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          text = wheel.read(entry).decode()
          assert "silver-run = silver_spark.job:main_run" in text, text
          print(sorted(n for n in names if n.endswith(".py")))
          EOF
