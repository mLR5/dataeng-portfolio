name: Compare Silver v1 and v2 (read-only)

# Evidence for the Silver v2 migration: reads silver/weatherapi (v1) and
# silver/weatherapi_v2 (v2) with delta-rs, prints PASS/FAIL lines and counts only.
# Run after the first Silver v2 job run on silver/weatherapi_v2 (November 2026).
on:
  push:
    branches: [validation/silver-v2-compare]
    paths: ['.github/workflows/compare-silver-v1-v2.yml', '.github/profile/compare_silver_v1_v2.py']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Storage key (masked)
        run: |
          echo "::add-mask::$(az account show --query id -o tsv)"
          key=$(az storage account keys list -n "$ACCOUNT" --only-show-errors --query "[0].value" -o tsv)
          echo "::add-mask::$key"
          echo "STORAGE_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet deltalake==1.2.1 pyarrow==21.0.0 duckdb==2.0.0 pytz
      - name: Compare
        run: python -I .github/profile/compare_silver_v1_v2.py
