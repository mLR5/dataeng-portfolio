name: Validate Databricks serverless readiness without deployment

# Read-only preflight on an isolated branch. ARM validate is not a deployment.
on:
  push:
    branches: [audit/databricks-serverless-readiness, claude/gallant-brahmagupta-p2hg55]
    paths:
      - '.github/workflows/audit-serverless-readiness.yml'
      - 'scripts/audit_databricks_serverless.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: audit-databricks-serverless-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Azure login with OIDC
        id: oidc
        if: vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.TF_VAR_SUBSCRIPTION_ID }}
      - name: Azure login with existing project identity
        id: existing_identity
        if: vars.AZURE_CLIENT_ID == ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Validate serverless and classic templates, permissions and policies
        if: always()
        env:
          PROJECT_NAME: ${{ secrets.TF_VAR_PROJECT_NAME }}
          DEPLOYMENT_ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
          STORAGE_ACCOUNT_NAME: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
          OIDC_OUTCOME: ${{ steps.oidc.outcome }}
          EXISTING_IDENTITY_OUTCOME: ${{ steps.existing_identity.outcome }}
        run: python scripts/audit_databricks_serverless.py
      - name: Preserve sanitized readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databricks-serverless-readiness
          path: databricks-serverless-readiness.json
          if-no-files-found: warn
          retention-days: 14
