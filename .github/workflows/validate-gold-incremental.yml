name: Validate Gold incremental load

on:
  push:
    branches: [validation/gold-incremental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-incremental-validation
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    env:
      PROJECT: ${{ secrets.TF_VAR_PROJECT_NAME }}
      ENVIRONMENT: ${{ secrets.TF_VAR_ENVIRONMENT }}
      ACCOUNT: ${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}
      SILVER_PATH: ${{ vars.DATABRICKS_SILVER_PATH || 'silver/weatherapi_v2' }}
      GOLD_RUN_TAG: inc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Isolated root gold/_validation/incremental/<tag>, no Unity Catalog registration.
      - name: Benchmark full vs incremental Gold through the deployment identity
        run: python -I scripts/gold_cloud_run.py --benchmark --report /tmp/gold-incremental-result.json
      - name: Upload sanitized benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-incremental-result
          path: /tmp/gold-incremental-result.json
          if-no-files-found: warn
