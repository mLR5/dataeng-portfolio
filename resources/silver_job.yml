resources:
  jobs:
    silver_weatherapi:
      name: silver-weatherapi
      description: Publish pending Bronze ingestions into Silver Delta tables, then check freshness.
      # Replaces the Blob lease of S3: never two writers at once.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      # Startup latency does not matter for a nightly batch; standard mode costs less.
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_status}
      email_notifications:
        on_failure: ${var.failure_emails}

      environments:
        - environment_key: silver
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: publish
          environment_key: silver
          # A failed run is safe to replay: publications make it idempotent.
          max_retries: 2
          min_retry_interval_millis: 300000
          python_wheel_task:
            package_name: weather_silver_spark
            entry_point: silver-run
            parameters:
              - --bronze-root
              - abfss://bronze@${var.storage_account}.dfs.core.windows.net
              - --silver-root
              - abfss://datalake@${var.storage_account}.dfs.core.windows.net/${var.silver_path}

        - task_key: freshness
          depends_on:
            - task_key: publish
          environment_key: silver
          python_wheel_task:
            package_name: weather_silver_spark
            entry_point: silver-freshness
            parameters:
              - --silver-root
              - abfss://datalake@${var.storage_account}.dfs.core.windows.net/${var.silver_path}
