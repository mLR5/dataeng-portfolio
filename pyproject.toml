[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Wheel for the Databricks Silver job only. The Function App keeps deploying
# functions/ with functions/requirements.txt; this file does not change Bronze.
[project]
name = "weather-silver-spark"
version = "1.0.0"
description = "Silver WeatherAPI on Databricks serverless, reusing the S1 contract and S2 transformer"
requires-python = ">=3.10"
# PySpark and Delta are provided by Databricks; pyarrow is pinned by the runtime.
dependencies = ["pyarrow>=14"]

[project.scripts]
silver-run = "silver_spark.job:main_run"
silver-freshness = "silver_spark.job:main_freshness"

[tool.setuptools]
# Only Azure-free modules are imported by silver_spark; the rest ships unused.
packages = ["shared", "silver_spark"]

[tool.setuptools.package-dir]
shared = "functions/shared"
silver_spark = "spark/silver_spark"
